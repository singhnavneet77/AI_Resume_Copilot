version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_copilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume_admin
      POSTGRES_PASSWORD: resume_admin_pw
      POSTGRES_DB: resume_copilot
    ports:
      - "5432:5432"
    volumes:
      - resume_copilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_admin -d resume_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: lightweight web UI for browsing the database while developing.
  # Visit http://localhost:5050 (login: admin@admin.com / admin) and add a
  # server pointing at host "postgres", port 5432, using the credentials above.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: resume_copilot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  resume_copilot_pgdata:
